[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-manager"
version = "0.1.0"
description = "Учебный файловый менеджер с CLI и TUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "rich==13.7.1",
  "typer==0.12.3",
  "textual==0.58.1"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
